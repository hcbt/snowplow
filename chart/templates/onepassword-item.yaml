{{- if .Values.auth.onePassword.enabled }}
{{- if not .Values.auth.onePassword.itemPath }}
{{- fail "snowplow: auth.onePassword.enabled is set but auth.onePassword.itemPath is empty" }}
{{- end }}
# Optional: syncs a 1Password item into the Secret the runners read, for
# clusters running the 1Password Kubernetes operator. Every field of the item
# becomes a key of the Secret, so the item needs a field named after
# `auth.secretKey` holding the PAT.
#
# Any other way of producing that Secret works just as well — this is a
# convenience, not a dependency. Until the item exists the operator does not
# create the Secret and the pod stays Pending on the missing reference.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "snowplow.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowplow.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.auth.onePassword.itemPath | quote }}
{{- end }}
