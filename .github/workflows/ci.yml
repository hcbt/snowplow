name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Chart lint, the render assertions, treefmt and the git hooks.
      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      # There is no flake any more. Every check was a derivation, so building
      # it IS running it.
      - name: Build every output
        run: devenv build

      - name: Run the hooks
        run: devenv shell prek -- run --all-files

  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      # `devenv build` above only evaluates most of the image; this is what
      # proves it actually builds. Kept separate from the smoke job below
      # because that one cannot run for pull requests from forks, where
      # GITHUB_TOKEN has no write access to packages.
      - name: Build the reference image
        run: |
          devenv build outputs.reference-runner > build.json
          path=$(sed -n 's/.*"outputs\.reference-runner": *"\([^"]*\)".*/\1/p' build.json)
          test -n "$path" || { cat build.json >&2; exit 1; }
          ln -sfn "$path" result

      # Two things that only exist at runtime, asserted in a real container at
      # the real paths. `nix flake check` runs both probes against the store
      # paths (outputs.usr-bin-env-runs-scripts and friends), but
      # nothing there can prove `/usr/bin/env` is `/usr/bin/env` once the image
      # is the root filesystem — a nix build has no container to be inside of.
      #
      # Both failures are silent in the worst way: a portable shebang produces
      # "bad interpreter" from a tool that looked installed, and hashFiles()
      # fails during expression evaluation, which skips the step and every step
      # after it — including one meant to report the job's verdict.
      - name: The image must exec a portable shebang and evaluate hashFiles()
        run: |
          image=$(docker load --input result | sed -n 's/^Loaded image: //p')
          test -n "$image"
          docker run --rm "$image" /bin/bash -euo pipefail -c '
            mkdir -p /tmp/probe && cd /tmp/probe

            # An interpreter NAME, the way a third-party script writes it: only
            # /usr/bin/env can turn that into a path.
            printf "%s\n" "#!/usr/bin/env bash" "echo portable-shebang-ok" > probe
            chmod +x probe
            ./probe | grep -qx portable-shebang-ok

            # Where the runner itself looks for the internal node it evaluates
            # hashFiles() with: the parent of the directory Runner.Worker lives
            # in, which is inside the runner package, not $RUNNER_ROOT.
            root=$(dirname "$(dirname "$(readlink -f /bin/Runner.Listener)")")/lib
            echo hello > a.txt
            patterns=a.txt "$root/externals/node20/bin/node" \
              "$root/github-runner/hashFiles" 2>&1 \
              | grep -Eq "__OUTPUT__[0-9a-f]{64}__OUTPUT__"
          '

  # Exercises build-push-image.yml — the workflow consumers call — end to end:
  # input plumbing, the skopeo-or-nixpkgs fallback, and the push loop. Nothing
  # else runs it, so a break there would only ever surface in someone else's
  # repository.
  #
  # The package it pushes is a CI artifact, not a release: snowplow publishes no
  # runner image, because the useful part is the toolchain you put in it.
  smoke-reusable-workflow:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-push-image.yml
    with:
      package: runner-image
      # This repository has no flake any more, so its own reusable workflow is
      # exercised in the mode consumers now use.
      builder: devenv
      image: ghcr.io/${{ github.repository_owner }}/snowplow-ci-smoke
      tags: ${{ github.sha }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
