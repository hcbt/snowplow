# Reusable workflow: build a runner image with Nix and push it to a registry.
#
# The implementation moved to coldstart along with the image builder. This is a
# forwarder, kept so existing callers do not have to change:
#
#   uses: hcbt/snowplow/.github/workflows/build-push-image.yml@master
#
# New callers should use coldstart's directly — there is nothing runner-specific
# left in here.
name: build-push-image

on:
  workflow_call:
    inputs:
      package:
        description: Flake package to build, e.g. `runner-image`.
        type: string
        required: true
      image:
        description: Target image without a tag, e.g. `ghcr.io/OWNER/NAME`.
        type: string
        required: true
      flake-ref:
        description: Flake to build from.
        type: string
        default: "."
      system:
        description: Nix system to build for.
        type: string
        default: x86_64-linux
      tags:
        description: Newline-separated tags to push.
        type: string
        default: |
          ${{ github.sha }}
          latest
      registry-username:
        description: Registry username.
        type: string
        default: ${{ github.actor }}
      runs-on:
        description: Runner label for this job.
        type: string
        default: ubuntu-latest
      install-nix:
        description: Install Nix. Set false when the runner image already ships it.
        type: boolean
        default: true
      free-disk-space:
        description: Reclaim GitHub-hosted runner disk before building.
        type: boolean
        default: false
    secrets:
      registry-password:
        description: Registry password or token.
        required: true

jobs:
  build-push:
    uses: hcbt/coldstart/.github/workflows/build-push-image.yml@v0.3.2
    with:
      package: ${{ inputs.package }}
      image: ${{ inputs.image }}
      flake-ref: ${{ inputs.flake-ref }}
      system: ${{ inputs.system }}
      tags: ${{ inputs.tags }}
      registry-username: ${{ inputs.registry-username }}
      runs-on: ${{ inputs.runs-on }}
      install-nix: ${{ inputs.install-nix }}
      free-disk-space: ${{ inputs.free-disk-space }}
    secrets:
      registry-password: ${{ secrets.registry-password }}
