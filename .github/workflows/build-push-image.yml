# Reusable workflow: build a runner image with Nix and push it to a registry.
#
# Call it from the repository that defines the image:
#
#   jobs:
#     runner-image:
#       permissions:
#         contents: read
#         packages: write
#       uses: hcbt/snowplow/.github/workflows/build-push-image.yml@main
#       with:
#         package: ci-runner
#         image: ghcr.io/${{ github.repository_owner }}/ci-runner
#       secrets:
#         registry-password: ${{ secrets.GITHUB_TOKEN }}
#
# Pushed with skopeo rather than docker: there is no daemon involved, and the
# image is a docker-archive that Nix already produced.
#
# Two tags by default: the commit SHA, and `latest`. Keep `latest` — reproducible
# images are all stamped at epoch 0, so any "newest build" tag ordering sees them
# as equally old and never picks a winner. Tracking the digest of one mutable tag
# is the strategy that works (argocd-image-updater: `updateStrategy: digest`).
name: build-push-image

on:
  workflow_call:
    inputs:
      package:
        description: Flake package to build, e.g. `runner-image`.
        type: string
        required: true
      image:
        description: Target image without a tag, e.g. `ghcr.io/OWNER/NAME`.
        type: string
        required: true
      flake-ref:
        description: Flake to build from.
        type: string
        default: "."
      system:
        description: Nix system to build for.
        type: string
        default: x86_64-linux
      tags:
        description: Newline-separated tags to push.
        type: string
        default: |
          ${{ github.sha }}
          latest
      registry-username:
        description: Registry username.
        type: string
        default: ${{ github.actor }}
      runs-on:
        description: Runner label for this job.
        type: string
        default: ubuntu-latest
      install-nix:
        description: Install Nix. Set false when the runner image already ships it.
        type: boolean
        default: true
    secrets:
      registry-password:
        description: Registry password or token.
        required: true

jobs:
  build-push:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        if: inputs.install-nix
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build image
        run: nix build '${{ inputs.flake-ref }}#packages.${{ inputs.system }}.${{ inputs.package }}' -L

      - name: Push
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ inputs.tags }}
          CREDS: ${{ inputs.registry-username }}:${{ secrets.registry-password }}
        run: |
          set -eu
          archive="$(readlink -f result)"
          # skopeo comes from the image when it ships one, and from nixpkgs
          # otherwise, so this works on hosted and self-hosted runners alike.
          if command -v skopeo > /dev/null; then
            skopeo=skopeo
          else
            skopeo="nix shell nixpkgs#skopeo -c skopeo"
          fi
          echo "$TAGS" | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "pushing $IMAGE:$tag"
            $skopeo copy --all "docker-archive:$archive" "docker://$IMAGE:$tag" --dest-creds "$CREDS"
          done
